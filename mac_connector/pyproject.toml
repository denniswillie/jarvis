[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-project-connector"
version = "0.1.0"
description = "Scoped read-only Mac project access for Jarvis"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "jedi==0.19.2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jarvis-project-connector = "jarvis_project_connector.__main__:main"

[tool.setuptools.package-data]
jarvis_project_connector = ["*.cjs"]

[tool.setuptools.packages.find]
include = ["jarvis_project_connector*"]
