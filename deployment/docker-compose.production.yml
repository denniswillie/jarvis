services:
  jarvis-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    # Current supported voice scope. Do not disable the independent Gemini vision key.
    environment:
      AUDIO_PROVIDER_DEFAULT: openai
      GEMINI_LIVE_ENABLED: "false"
      SECOND_BRAIN_FRONTIER_MODEL: ${JARVIS_FRONTIER_MODEL:-gpt-5.6-sol}
    ports:
      - "127.0.0.1:9000:9000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
