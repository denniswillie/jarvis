# Focused personal-use release. Apply after the existing production/frontier,
# api-knowledge/frontier-knowledge and frontier-images/sandbox/artifacts files.
# Both roles use the same selected model, owner and knowledge area.
services:
  jarvis-backend:
    image: ${JARVIS_FOCUSED_API_IMAGE:?Set the focused API release image}
    environment:
      JARVIS_OWNER_ID: ${JARVIS_FRONTIER_OWNER_ID:?Set the personal owner}
      AUDIO_PROVIDER_DEFAULT: openai
      GEMINI_LIVE_ENABLED: "false"
      SECOND_BRAIN_ENABLED: "true"
      SECOND_BRAIN_TASKS_ENABLED: "true"
      SECOND_BRAIN_FRONTIER_ENABLED: "true"
      SECOND_BRAIN_FRONTIER_MODEL: ${JARVIS_FRONTIER_MODEL:-gpt-5.6-sol}
      SECOND_BRAIN_FRONTIER_REASONING_EFFORT: ${JARVIS_FRONTIER_REASONING_EFFORT:-medium}
      SECOND_BRAIN_TASK_INPUT_TOKENS: ${JARVIS_TASK_INPUT_TOKENS:-250000}
      SECOND_BRAIN_KNOWLEDGE_ENABLED: "true"
      SECOND_BRAIN_MEMORY_AUTHORITY: hindsight
      SECOND_BRAIN_ATTENTION_ENABLED: "true"
      SECOND_BRAIN_ATTENTION_VOICE_ENABLED: "true"
      SECOND_BRAIN_ATTENTION_VOICE_MODEL: gpt-4o-mini-tts-2025-12-15
      SECOND_BRAIN_ATTENTION_VOICE_VOICE: cedar
      SECOND_BRAIN_SANDBOX_ENABLED: ${JARVIS_SANDBOX_ENABLED:-false}
      SECOND_BRAIN_SANDBOX_INTERNET_ENABLED: ${JARVIS_SANDBOX_INTERNET_ENABLED:-false}
      SECOND_BRAIN_SANDBOX_DESKTOP_ENABLED: ${JARVIS_SANDBOX_DESKTOP_ENABLED:-false}
      SECOND_BRAIN_ARTIFACTS_ENABLED: ${JARVIS_ARTIFACTS_ENABLED:-false}
      SECOND_BRAIN_RESPONSIBILITIES_ENABLED: ${JARVIS_RESPONSIBILITIES_ENABLED:-false}
      SECOND_BRAIN_PUSH_ENABLED: ${JARVIS_PUSH_ENABLED:-false}
      SECOND_BRAIN_MAIL_ENABLED: "false"
      MEMORY_JOB_RUNNER_ENABLED: "false"
      MEMORY_MAINTENANCE_ENABLED: "false"
  jarvis-frontier:
    image: ${JARVIS_FOCUSED_WORKER_IMAGE:?Set the focused worker release image}
    environment:
      SECOND_BRAIN_MEMORY_AUTHORITY: hindsight
      SECOND_BRAIN_KNOWLEDGE_ENABLED: "true"
      SECOND_BRAIN_FRONTIER_MODEL: ${JARVIS_FRONTIER_MODEL:-gpt-5.6-sol}
      SECOND_BRAIN_FRONTIER_REASONING_EFFORT: ${JARVIS_FRONTIER_REASONING_EFFORT:-medium}
      SECOND_BRAIN_TASK_INPUT_TOKENS: ${JARVIS_TASK_INPUT_TOKENS:-250000}
