# Merge these sections into an ISOLATED retained Hermes profile's config.yaml.
# Preserve that profile's Jarvis plugin, session, tool and sandbox configuration.
# Supply the Meta key as OPENAI_API_KEY only in the Hermes process environment.
# Do not overwrite the OpenAI key used by the Jarvis/GPT-Live process.
model:
  provider: custom
  default: muse-wonder-1.0
  base_url: https://api.meta.ai/v1

agent:
  reasoning_effort: low

# Pin auxiliary endpoints too. Their credentials use the isolated worker key.
# Main/child turns and all four auxiliary routes have passed isolated real calls.
# This does not imply full phone or production-profile qualification.
auxiliary:
  vision:
    base_url: https://api.meta.ai/v1
    model: muse-wonder-1.0
    reasoning_effort: minimal
  compression:
    base_url: https://api.meta.ai/v1
    model: muse-spark-1.3
    reasoning_effort: minimal
  web_extract:
    base_url: https://api.meta.ai/v1
    model: muse-spark-1.3
    reasoning_effort: minimal
  title_generation:
    base_url: https://api.meta.ai/v1
    model: muse-spark-1.3
    reasoning_effort: minimal
