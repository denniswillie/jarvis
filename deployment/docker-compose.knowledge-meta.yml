# Overlay the normal Hindsight stack, with a DISTINCT project name and secrets.
# See META_SETUP.md. Never apply this to the running GPT Compose project.
services:
  hindsight-api:
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: https://api.meta.ai/v1
      HINDSIGHT_API_LLM_MODEL: muse-spark-1.3
      HINDSIGHT_API_LLM_API_KEY_FILE: /run/secrets/meta_api_key
      HINDSIGHT_API_LLM_REASONING_EFFORT: minimal
      HINDSIGHT_API_LLM_TEMPERATURE: none
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "4"
      HINDSIGHT_API_LLM_MAX_RETRIES: "2"
      HINDSIGHT_API_LLM_TIMEOUT: "90"
      HINDSIGHT_API_LLM_STRICT_SCHEMA: "true"
      HINDSIGHT_API_LLM_STRICT_SCHEMA_RETAIN: "true"
      HINDSIGHT_API_LLM_STRICT_SCHEMA_CONSOLIDATION: "true"
      HINDSIGHT_API_LLM_STRICT_SCHEMA_REFLECT: "true"
      HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: "8192"
      HINDSIGHT_API_CONSOLIDATION_MAX_COMPLETION_TOKENS: "8192"
      HINDSIGHT_API_REFLECT_LLM_PROVIDER: openai
      HINDSIGHT_API_REFLECT_LLM_BASE_URL: https://api.meta.ai/v1
      HINDSIGHT_API_REFLECT_LLM_MODEL: muse-wonder-1.0
      HINDSIGHT_API_REFLECT_LLM_REASONING_EFFORT: low
      # Pinned 0.9.2 otherwise forces tool_choice=required, rejected by Meta.
      HINDSIGHT_API_REFLECT_LLM_EXTRA_BODY: '{"tool_choice":"auto"}'
      HINDSIGHT_API_REFLECT_MAX_COMPLETION_TOKENS: "8192"
      HINDSIGHT_API_REFLECT_MAX_ITERATIONS: "5"
      HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "120"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: https://api.openai.com/v1
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "true"
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "true"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    secrets:
      - meta_api_key
secrets:
  meta_api_key:
    file: ${JARVIS_HINDSIGHT_SECRET_DIR:?Set a private absolute secrets directory}/meta-api-key
